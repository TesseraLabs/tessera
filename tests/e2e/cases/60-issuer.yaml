suite: issuer
description: Выпуск удостоверений и приём выпущенного модулем аутентификации
setup: [build-pam-drive, install-package, deploy-fixtures, deploy-issuer]

# Выпуск проверяется файловым бэкендом подписи: ключ лежит на диске, HSM и токен
# не нужны. Это не подмена продуктового пути — тот же код сборки TBS и подписи,
# отличается только источник ключа, и именно так issuer работает у оператора
# без аппаратного носителя.
#
# Корень задаёт КОНВЕРТ выпуска (--allow-role, --max-ttl, --max-level), а лист
# может только сужать его. Поэтому корень здесь всегда выпускается с конвертом:
# под корнем без него не выпустить ни одного листа с ненулевым сроком.
#
# Рабочие файлы живут в /tmp/issuer-e2e и удаляются в teardown: выпущенные
# прогоном удостоверения и приватные ключи не должны его переживать.

cases:
  - id: ISS-001
    title: Выпуск корня парка даёт самоподписанный сертификат
    requirement: openspec/specs/cert-issuance/spec.md
    requires: []
    steps:
      - run: |
          rm -rf /tmp/issuer-e2e && install -d -m 0700 /tmp/issuer-e2e
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
            -out /tmp/issuer-e2e/root.key.pem 2>/dev/null
          openssl pkey -in /tmp/issuer-e2e/root.key.pem -pubout \
            -out /tmp/issuer-e2e/root.spki.pem 2>/dev/null
          N=$(date -u +%s)
          issuer issue-root --backend file --key-file /tmp/issuer-e2e/root.key.pem \
            --spki /tmp/issuer-e2e/root.spki.pem --subject "CN=E2E Fleet Root" \
            --not-before $N --not-after $(( N + 86400 )) \
            --allow-role oper --max-ttl 7200 \
            --journal /tmp/issuer-e2e/journal.ndjson \
            --out /tmp/issuer-e2e/root.crt.pem
      # Корень парка самоподписан: issuer и subject совпадают, иначе это не корень.
      - run: openssl x509 -in /tmp/issuer-e2e/root.crt.pem -noout -subject -issuer
        expect:
          exit_code: 0
          stdout_matches: 'subject=CN\s*=\s*E2E Fleet Root\nissuer=CN\s*=\s*E2E Fleet Root'
    teardown:
      - run: rm -rf /tmp/issuer-e2e

  - id: ISS-002
    title: Подделка записи в журнале выпусков ломает цепочку хешей
    requirement: openspec/specs/issuance-journal/spec.md
    requires: []
    steps:
      - run: |
          rm -rf /tmp/issuer-e2e && install -d -m 0700 /tmp/issuer-e2e
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
            -out /tmp/issuer-e2e/root.key.pem 2>/dev/null
          openssl pkey -in /tmp/issuer-e2e/root.key.pem -pubout \
            -out /tmp/issuer-e2e/root.spki.pem 2>/dev/null
          N=$(date -u +%s)
          issuer issue-root --backend file --key-file /tmp/issuer-e2e/root.key.pem \
            --spki /tmp/issuer-e2e/root.spki.pem --subject "CN=E2E Fleet Root" \
            --not-before $N --not-after $(( N + 86400 )) \
            --allow-role oper --max-ttl 7200 \
            --journal /tmp/issuer-e2e/journal.ndjson \
            --out /tmp/issuer-e2e/root.crt.pem
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
            -out /tmp/issuer-e2e/leaf.key.pem 2>/dev/null
          openssl pkey -in /tmp/issuer-e2e/leaf.key.pem -pubout \
            -out /tmp/issuer-e2e/leaf.spki.pem 2>/dev/null
          issuer issue-leaf --backend file --key-file /tmp/issuer-e2e/root.key.pem \
            --parent /tmp/issuer-e2e/root.crt.pem \
            --spki /tmp/issuer-e2e/leaf.spki.pem --subject "CN={{user}}" \
            --host '*' --role oper \
            --not-before $N --not-after $(( N + 3600 )) \
            --journal /tmp/issuer-e2e/journal.ndjson \
            --out /tmp/issuer-e2e/leaf.crt.pem
      # Журнал — доказательство того, кто и что выпустил; целостность держится
      # цепочкой хешей, а не доверием к файлу. Записей две: подделку первой
      # выдаёт несовпадение с prev_hash второй.
      - run: issuer verify-journal --journal /tmp/issuer-e2e/journal.ndjson
        expect: { exit_code: 0, stdout_matches: 'chain intact' }
      # Подменяется время записи — поле, входящее в хешируемую часть. Если такая
      # правка проходит незамеченной, журнал перестаёт быть доказательством.
      - run: |
          sed -i '1s/"ts":[0-9]*/"ts":1000000000/' /tmp/issuer-e2e/journal.ndjson
      - run: issuer verify-journal --journal /tmp/issuer-e2e/journal.ndjson
        expect: { exit_code: 1 }
    teardown:
      - run: rm -rf /tmp/issuer-e2e

  - id: ISS-003
    title: Выпущенный лист несёт заданные рамки применения
    requirement: openspec/specs/cert-scope-binding/spec.md
    requires: []
    steps:
      - run: |
          rm -rf /tmp/issuer-e2e && install -d -m 0700 /tmp/issuer-e2e
          for k in root leaf; do
            openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
              -out /tmp/issuer-e2e/$k.key.pem 2>/dev/null
            openssl pkey -in /tmp/issuer-e2e/$k.key.pem -pubout \
              -out /tmp/issuer-e2e/$k.spki.pem 2>/dev/null
          done
          N=$(date -u +%s)
          issuer issue-root --backend file --key-file /tmp/issuer-e2e/root.key.pem \
            --spki /tmp/issuer-e2e/root.spki.pem --subject "CN=E2E Fleet Root" \
            --not-before $N --not-after $(( N + 86400 )) \
            --allow-role oper --max-ttl 7200 \
            --journal /tmp/issuer-e2e/journal.ndjson \
            --out /tmp/issuer-e2e/root.crt.pem
          issuer issue-leaf --backend file --key-file /tmp/issuer-e2e/root.key.pem \
            --parent /tmp/issuer-e2e/root.crt.pem \
            --spki /tmp/issuer-e2e/leaf.spki.pem \
            --subject "CN={{user}}" \
            --host '*' --role oper \
            --not-before $N --not-after $(( N + 3600 )) \
            --journal /tmp/issuer-e2e/journal.ndjson \
            --out /tmp/issuer-e2e/leaf.crt.pem
      # Рамки применения — то, чем удостоверение ограничено: без них лист пускал бы
      # кого угодно и куда угодно. Осей две: на каких устройствах (host_binding)
      # и какие роли — а значит и в какие ролевые учётные записи — разрешены
      # (allowed_roles).
      - run: openssl x509 -in /tmp/issuer-e2e/leaf.crt.pem -noout -text
        expect:
          exit_code: 0
          stdout_matches: '2\.25\.183976554325829274683049824615098'
      - run: openssl x509 -in /tmp/issuer-e2e/leaf.crt.pem -noout -text
        expect:
          exit_code: 0
          stdout_matches: '2\.25\.185305973969816596290730578528098241367'
      # Отозванный OID user_binding в выпущенном листе присутствовать не должен:
      # выпуск, продолжающий его класть, означал бы, что удалённый механизм жив.
      # Разбор сертификата проверяется отдельным шагом до поиска: иначе сбой
      # самого openssl дал бы пустой вывод и «отсутствие» выглядело бы успехом.
      - run: |
          text=$(openssl x509 -in /tmp/issuer-e2e/leaf.crt.pem -noout -text) || exit 1
          printf '%s' "$text" | grep -q 'X509v3' || exit 1
          if printf '%s' "$text" | grep -q '2\.25\.215438916728501023845629178354627'; then
            echo "выпущенный лист несёт отозванное расширение user_binding" >&2
            exit 1
          fi
        expect: { exit_code: 0 }
    teardown:
      - run: rm -rf /tmp/issuer-e2e

  - id: ISS-004
    title: Расширение рамок относительно родителя отклоняется
    requirement: openspec/specs/cert-issuance/spec.md
    requires: []
    steps:
      # Монотонное сужение: выпускающий не может выдать больше прав, чем имеет сам.
      # Без этого правила скомпрометированный промежуточный центр выписывал бы
      # себе любые полномочия, а иерархия доверия теряла бы смысл.
      - run: |
          rm -rf /tmp/issuer-e2e && install -d -m 0700 /tmp/issuer-e2e
          for k in root leaf; do
            openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
              -out /tmp/issuer-e2e/$k.key.pem 2>/dev/null
            openssl pkey -in /tmp/issuer-e2e/$k.key.pem -pubout \
              -out /tmp/issuer-e2e/$k.spki.pem 2>/dev/null
          done
          N=$(date -u +%s)
          issuer issue-root --backend file --key-file /tmp/issuer-e2e/root.key.pem \
            --spki /tmp/issuer-e2e/root.spki.pem --subject "CN=E2E Fleet Root" \
            --not-before $N --not-after $(( N + 86400 )) \
            --allow-role oper --max-ttl 7200 \
            --journal /tmp/issuer-e2e/journal.ndjson \
            --out /tmp/issuer-e2e/root.crt.pem
      # Конверт корня разрешает только oper; лист просит serv.
      - run: |
          N=$(date -u +%s)
          issuer issue-leaf --backend file --key-file /tmp/issuer-e2e/root.key.pem \
            --parent /tmp/issuer-e2e/root.crt.pem \
            --spki /tmp/issuer-e2e/leaf.spki.pem \
            --subject "CN={{user}}" \
            --host '*' --role serv \
            --not-before $N --not-after $(( N + 3600 )) \
            --journal /tmp/issuer-e2e/journal.ndjson \
            --out /tmp/issuer-e2e/leaf.crt.pem
        expect:
          exit_code: 1
          stderr_matches: 'widens the parent envelope'
      # Отказ должен быть настоящим: файла быть не должно, иначе «отклонено»
      # означало бы лишь ненулевой код при выпущенном сертификате.
      - expect_file: { path: /tmp/issuer-e2e/leaf.crt.pem, exists: false }
    teardown:
      - run: rm -rf /tmp/issuer-e2e

  - id: ISS-005
    title: Выпущенным удостоверением можно войти в систему
    requirement: openspec/specs/cert-issuance/spec.md
    requires: [service-manager, usb]
    steps:
      # Сквозной кейс: «выпустили → записали на носитель → вошли» целиком.
      # Единственный, который подтверждает, что issuer и модуль аутентификации
      # понимают друг друга: по отдельности обе стороны могут быть исправны
      # и при этом несовместимы.
      # Вход требует роли всегда, поэтому кейс поднимает ролевое хранилище и
      # входит по имени ролевой учётной записи — так же, как это делает парк.
      - run: id -u serv >/dev/null 2>&1 || useradd -m -s /bin/bash serv
      - run: |
          rm -rf /tmp/issuer-e2e && install -d -m 0700 /tmp/issuer-e2e
          for k in root leaf; do
            openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
              -out /tmp/issuer-e2e/$k.key.pem 2>/dev/null
            openssl pkey -in /tmp/issuer-e2e/$k.key.pem -pubout \
              -out /tmp/issuer-e2e/$k.spki.pem 2>/dev/null
          done
          N=$(( $(date -u +%s) - 300 ))
          issuer issue-root --backend file --key-file /tmp/issuer-e2e/root.key.pem \
            --spki /tmp/issuer-e2e/root.spki.pem --subject "CN=E2E Fleet Root" \
            --not-before $N --not-after $(( N + 86400 )) \
            --allow-role serv --max-ttl 7200 \
            --journal /tmp/issuer-e2e/journal.ndjson \
            --out /tmp/issuer-e2e/root.crt.pem
          issuer issue-leaf --backend file --key-file /tmp/issuer-e2e/root.key.pem \
            --parent /tmp/issuer-e2e/root.crt.pem \
            --spki /tmp/issuer-e2e/leaf.spki.pem \
            --subject "CN=serv" \
            --host '*' --role serv \
            --not-before $N --not-after $(( N + 3600 )) \
            --journal /tmp/issuer-e2e/journal.ndjson \
            --out /tmp/issuer-e2e/leaf.crt.pem
          openssl pkcs12 -export -inkey /tmp/issuer-e2e/leaf.key.pem \
            -in /tmp/issuer-e2e/leaf.crt.pem -certfile /tmp/issuer-e2e/root.crt.pem \
            -passout pass:e2e-issued -out /tmp/issuer-e2e/leaf.p12
      # Доверие устройства переводится на выпущенный корень: иначе кейс проверял бы
      # совпадение с заранее розданными якорями, а не приём свежевыпущенного.
      - run: |
          install -m 0640 -o root -g root /tmp/issuer-e2e/root.crt.pem /etc/tessera/ca/bundle.pem
      - run: helpers/usb-loop.sh attach /tmp/issuer-e2e/leaf.p12
      # Отдельного указания роли нет: роль равна имени учётной записи входа.
      - run: pam-drive certauth serv authenticate
        stdin: "e2e-issued"
        expect: { exit_code: 0, stdout_matches: 'auth: PAM_SUCCESS \(0\)' }
        timeout: 60
    teardown:
      - run: helpers/usb-loop.sh detach
      - run: rm -rf /tmp/issuer-e2e
      - run: helpers/setup/deploy-fixtures.sh

  - id: ISS-006
    title: Выпуск с ключом, порождённым инструментом, даёт удостоверение для входа
    requirement: openspec/specs/credential-packaging/spec.md
    requires: [service-manager, usb]
    steps:
      # Второй сквозной кейс, отличающийся от ISS-005 происхождением ключа.
      # Там ключевую пару и контейнер делает openssl, а issuer только подписывает;
      # здесь оба шага выполняет сам инструмент: пара порождается при выпуске,
      # контейнер собирается им же, носитель раскладывается prepare-carrier.
      # Проверяется именно эта сборка: контейнер чужого производства уже
      # подтверждён соседним кейсом, а свой — нет, и разойтись они могут
      # незаметно (порядок мешков, шифрование сертификатов, MAC).
      - run: id -u serv >/dev/null 2>&1 || useradd -m -s /bin/bash serv
      - run: |
          rm -rf /tmp/issuer-gk && install -d -m 0700 /tmp/issuer-gk
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
            -out /tmp/issuer-gk/root.key.pem 2>/dev/null
          openssl pkey -in /tmp/issuer-gk/root.key.pem -pubout \
            -out /tmp/issuer-gk/root.spki.pem 2>/dev/null
          N=$(( $(date -u +%s) - 300 ))
          issuer issue-root --backend file --key-file /tmp/issuer-gk/root.key.pem \
            --spki /tmp/issuer-gk/root.spki.pem --subject "CN=E2E Fleet Root" \
            --not-before $N --not-after $(( N + 86400 )) \
            --allow-role serv --max-ttl 7200 \
            --journal /tmp/issuer-gk/journal.ndjson \
            --out /tmp/issuer-gk/root.crt.pem
      # Пароль подаётся файлом, а не аргументом: аргументы видны в списке
      # процессов. Файл читается только владельцем — инструмент это проверяет.
      - run: |
          umask 077
          printf '%s\n' "e2e-generated-pass" > /tmp/issuer-gk/pass
      - run: |
          N=$(( $(date -u +%s) - 300 ))
          issuer issue-leaf --backend file --key-file /tmp/issuer-gk/root.key.pem \
            --parent /tmp/issuer-gk/root.crt.pem \
            --generate-key --key-type ecdsa-p256 \
            --subject "CN=serv" --host '*' --role serv \
            --not-before $N --not-after $(( N + 3600 )) \
            --journal /tmp/issuer-gk/journal.ndjson \
            --p12-passphrase-file /tmp/issuer-gk/pass \
            --out-p12 /tmp/issuer-gk/leaf.p12
        expect: { exit_code: 0, stdout_matches: 'PKCS#12 container written to' }
      # Закрытый ключ отдельным файлом не сохраняется: он существует только
      # внутри контейнера. Отдельного ключевого файла рядом быть не должно.
      - expect_file: { path: /tmp/issuer-gk/leaf.p12, mode: "0600" }
      - run: |
          install -d /tmp/issuer-gk/media
          issuer prepare-carrier --p12 /tmp/issuer-gk/leaf.p12 \
            --chain /tmp/issuer-gk/root.crt.pem --media /tmp/issuer-gk/media
        expect: { exit_code: 0, stdout_matches: 'carrier prepared' }
      # Раскладка кладёт артефакты туда, где их ищет проверка на устройстве.
      - expect_file: { path: /tmp/issuer-gk/media/certs/user.p12, exists: true }
      - expect_file: { path: /tmp/issuer-gk/media/certs/chain.pem, exists: true }
      - run: |
          install -m 0640 -o root -g root /tmp/issuer-gk/root.crt.pem /etc/tessera/ca/bundle.pem
      # На носитель едет контейнер из подготовленной раскладки. Саму запись
      # на loop-устройство делает хелпер: продукт монтирует носитель штатным
      # путём, а раскладку на нём подменять нечем — это граница кейса.
      - run: helpers/usb-loop.sh attach /tmp/issuer-gk/media/certs/user.p12
      - run: pam-drive certauth serv authenticate
        stdin: "e2e-generated-pass"
        expect: { exit_code: 0, stdout_matches: 'auth: PAM_SUCCESS \(0\)' }
        timeout: 60
    teardown:
      - run: helpers/usb-loop.sh detach
      - run: rm -rf /tmp/issuer-gk
      - run: helpers/setup/deploy-fixtures.sh

  - id: ISS-007
    title: Слишком короткий пароль контейнера отклоняет выпуск
    requirement: openspec/specs/credential-packaging/spec.md
    requires: [service-manager]
    steps:
      # Отказ наступает до подписи: удостоверение с паролем ниже порога не
      # должно существовать вовсе. Кейс держит границу со стороны продукта —
      # порог задан спекой, а не тем, что сегодня возвращает код.
      - run: |
          rm -rf /tmp/issuer-short && install -d -m 0700 /tmp/issuer-short
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
            -out /tmp/issuer-short/root.key.pem 2>/dev/null
          openssl pkey -in /tmp/issuer-short/root.key.pem -pubout \
            -out /tmp/issuer-short/root.spki.pem 2>/dev/null
          N=$(( $(date -u +%s) - 300 ))
          issuer issue-root --backend file --key-file /tmp/issuer-short/root.key.pem \
            --spki /tmp/issuer-short/root.spki.pem --subject "CN=E2E Fleet Root" \
            --not-before $N --not-after $(( N + 86400 )) \
            --allow-role serv --max-ttl 7200 \
            --journal /tmp/issuer-short/journal.ndjson \
            --out /tmp/issuer-short/root.crt.pem
          umask 077
          printf '%s\n' "short" > /tmp/issuer-short/pass
      - run: |
          N=$(( $(date -u +%s) - 300 ))
          issuer issue-leaf --backend file --key-file /tmp/issuer-short/root.key.pem \
            --parent /tmp/issuer-short/root.crt.pem \
            --generate-key --key-type ecdsa-p256 \
            --subject "CN=serv" --host '*' --role serv \
            --not-before $N --not-after $(( N + 3600 )) \
            --journal /tmp/issuer-short/journal.ndjson \
            --p12-passphrase-file /tmp/issuer-short/pass \
            --out-p12 /tmp/issuer-short/leaf.p12
        expect: { exit_code: 1, stderr_matches: 'the minimum is 12' }
      # Ничего не написано: отказ до подписи не оставляет ни контейнера, ни следа.
      - expect_file: { path: /tmp/issuer-short/leaf.p12, exists: false }
    teardown:
      - run: rm -rf /tmp/issuer-short
