suite: install
description: Установка пакета, раскладка файлов и интеграция в PAM-стек
setup: [install-package]

cases:
  - id: INST-001
    title: Пакет раскладывает модуль, бинарь и юнит по штатным путям
    requirement: spec9:platform.INST-001
    requires: []
    steps:
      # Пути — из debian/rules (модуль и бинарь ставятся вручную, минуя dh-cargo)
      # и debian/install (всё остальное). Модуль в /lib/security, а не в /usr/bin,
      # куда cdylib положил бы dh-cargo по умолчанию.
      - expect_file: { path: /lib/security/pam_tessera.so }
      - expect_file: { path: /usr/bin/tessera }
      - expect_file: { path: /lib/systemd/system/tessera.service }
      - expect_file: { path: /usr/lib/tmpfiles.d/tessera.conf }
      - expect_file: { path: /etc/tessera/config.toml.example }
      - expect_file: { path: /usr/share/tessera/integrate-pam.sh }
      - expect_file: { path: /etc/pam.d/tessera }

  - id: INST-002
    title: Пакет создаёт каталоги состояния и кеша
    requirement: spec9:platform.INST-002
    requires: []
    steps:
      # Перечень — из debian/tessera.dirs. Каталоги создаёт пакет, а не первый
      # запуск: иначе служба под непривилегированным пользователем не смогла бы
      # их завести сама.
      - expect_file: { path: /etc/tessera/ca }
      - expect_file: { path: /etc/tessera/crl }
      - expect_file: { path: /var/cache/tessera/ocsp }
      - expect_file: { path: /var/lib/tessera/daemon }

  - id: INST-003
    title: Служба не активируется установкой без конфигурации
    requirement: spec9:platform.INST-003
    requires: [service-manager]
    steps:
      # Гарантия: установка пакета не поднимает enforcement сама по себе.
      # Активация — осознанное действие оператора после настройки, о чём postinst
      # и печатает инструкцию.
      - run: systemctl is-active tessera.service
        expect: { exit_code: 3, stdout_matches: 'inactive' }

  - id: INST-004
    title: Интеграция в PAM-стек добавляет обе строки и повторно ничего не меняет
    requirement: spec9:platform.INST-004
    requires: []
    steps:
      - run: |
          cat > /tmp/e2e-pam-target <<'EOF'
          auth       required   pam_unix.so
          account    required   pam_unix.so
          session    required   pam_unix.so
          EOF
      - run: /usr/share/tessera/integrate-pam.sh /tmp/e2e-pam-target
      - expect_file: { path: /tmp/e2e-pam-target, matches: '@include tessera' }
      - expect_file:
          path: /tmp/e2e-pam-target
          matches: 'session\s+required\s+pam_tessera\.so'
      # Идемпотентность: повторный запуск не должен ни дублировать строки, ни падать.
      # Проверяется счётом вхождений, а не кодом возврата: скрипт завершится успехом
      # в обоих случаях, а дубль строки сломает стек молча.
      - run: /usr/share/tessera/integrate-pam.sh /tmp/e2e-pam-target
      - run: grep -c '^@include tessera$' /tmp/e2e-pam-target
        expect: { exit_code: 0, stdout_matches: '^1$' }
      - run: grep -cE '^session\s+required\s+pam_tessera\.so' /tmp/e2e-pam-target
        expect: { exit_code: 0, stdout_matches: '^1$' }
    teardown:
      - run: rm -f /tmp/e2e-pam-target /tmp/e2e-pam-target.bak.*

  - id: INST-005
    title: Откат интеграции снимает обе внесённые строки
    requirement: spec9:platform.INST-005
    requires: []
    steps:
      - run: |
          cat > /tmp/e2e-pam-revert <<'EOF'
          auth       required   pam_unix.so
          account    required   pam_unix.so
          session    required   pam_unix.so
          EOF
      - run: /usr/share/tessera/integrate-pam.sh /tmp/e2e-pam-revert
      - run: /usr/share/tessera/integrate-pam.sh --unintegrate /tmp/e2e-pam-revert
      # Обе строки, а не только @include: postrm снимает лишь include, и если
      # session-строка переживёт откат, она останется ссылаться на удалённый модуль —
      # после чего ломаются sudo и вход в систему.
      - run: grep -c 'tessera' /tmp/e2e-pam-revert
        expect: { exit_code: 1, stdout_matches: '^0$' }
    teardown:
      - run: rm -f /tmp/e2e-pam-revert /tmp/e2e-pam-revert.bak.*

  - id: INST-006
    title: Пакет ставит оверлей QR и каталог сокетов попыток
    requirement: spec9:platform.INST-001
    # Оверлей — не служба и не автозапуск: его на время одной попытки запускает
    # PAM-модуль от учётной записи греетера. Отсюда и проверяемое: бинарь на
    # месте, исполним, БЕЗ setuid и setgid (непривилегированность — это решение,
    # а не побочный эффект сборки), и запускается настолько, чтобы отвергнуть
    # вызов без сокета. Дисплея в контейнере нет, поэтому дальше разбора
    # аргументов кейс не идёт — и не должен: он про раскладку пакета.
    requires: []
    steps:
      - expect_file: { path: /usr/bin/tessera-qr-overlay }
      - run: test -x /usr/bin/tessera-qr-overlay
        expect: { exit_code: 0 }
      # `find -perm /6000` печатает путь, только если взведён setuid или setgid.
      # Пустой вывод — то, что требуется.
      - run: find /usr/bin/tessera-qr-overlay -perm /6000
        expect: { exit_code: 0, stdout_matches: '^$' }
      # Код 2 — «вызов неверен». Он отделяет разобранные аргументы от отказа
      # дисплея (1): без этого кейс зеленел бы и на бинаре, который не может
      # запуститься вовсе.
      - run: /usr/bin/tessera-qr-overlay
        expect: { exit_code: 2 }
      # Каталог сокетов попыток заводит пакет, а не первая попытка: модуль
      # работает от root и создал бы его сам, но тогда права зависели бы от umask
      # процесса, в который загрузили модуль.
      - expect_file: { path: /run/tessera-overlay }
      - run: stat -c '%a %U %G' /run/tessera-overlay
        expect: { exit_code: 0, stdout_matches: '^711 root root$' }
      # Права каталога записаны в ДВУХ местах: tmpfiles.d для systemd и
      # init-скрипт для хостов без него. Разъехавшись, они дали бы парк, где
      # оверлей поднимается на одном инициализаторе и молча не поднимается на
      # другом, а различие видно только на живом входе.
      # Сверяется и ВЛАДЕЛЕЦ, а не только режим: разъехавшийся владелец —
      # это ровно тот случай, который здесь однажды и жил (init заводил
      # /run/tessera как root:root, tmpfiles — как tessera:tessera, и демон
      # под User=tessera не мог туда писать на хостах без systemd).
      - run: grep -c '0711 root root' /usr/lib/tmpfiles.d/tessera.conf
        expect: { exit_code: 0, stdout_matches: '^1$' }
      - run: sh -c 'test -f /etc/init.d/tessera && grep -c "chmod 0711 /run/tessera-overlay" /etc/init.d/tessera || echo 1'
        expect: { exit_code: 0, stdout_matches: '^1$' }
      - run: sh -c 'test -f /etc/init.d/tessera && grep -c "chown root:root /run/tessera-overlay" /etc/init.d/tessera || echo 1'
        expect: { exit_code: 0, stdout_matches: '^1$' }
      # Каталог самого демона: 0750 tessera tessera в обоих местах.
      - run: grep -c '0750 tessera tessera' /usr/lib/tmpfiles.d/tessera.conf
        expect: { exit_code: 0, stdout_matches: '^1$' }
      - run: sh -c 'test -f /etc/init.d/tessera && grep -c "chown tessera:tessera /run/tessera" /etc/init.d/tessera || echo 1'
        expect: { exit_code: 0, stdout_matches: '^1$' }
      - run: stat -c '%a %U %G' /run/tessera
        expect: { exit_code: 0, stdout_matches: '^750 tessera tessera$' }
