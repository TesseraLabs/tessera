suite: cli-diagnostics
description: Диагностические команды — префлайт, выгрузка идентичностей узла, снятые подкоманды
setup: [install-package, deploy-fixtures]

# `tessera check` служит hard-gate'ом перед запуском службы, а вывод
# `dump-host-id` — тем, из чего администратор берёт отпечаток при выпуске
# удостоверения. Ошибка здесь не ломает вход, но приводит к выпуску
# удостоверения на неверный узел.

cases:
  - id: CLI-001
    title: Префлайт на исправной системе завершается успехом и печатает сводку
    requirement: openspec/specs/cli-diagnostics/spec.md
    requires: []
    # Предупреждения на исход не влияют: в контейнере всегда есть WARN об
    # отсутствии мандатного контроля, и гейт не должен на нём спотыкаться.
    steps:
      - run: tessera check
        expect:
          exit_code: 0
          stdout_matches: 'summary: \d+ info, \d+ warn, 0 error'

  - id: CLI-002
    title: Выгрузка идентичностей пробивает все источники и отмечает действующий
    requirement: openspec/specs/cli-diagnostics/spec.md
    requires: []
    # Команда намеренно игнорирует список источников из конфигурации: оператор
    # должен видеть всё железо целиком, включая источники, которые сейчас не
    # выбраны. Отметка действующего источника — то место, откуда берётся
    # отпечаток для выпуска, и перепутать его нельзя.
    steps:
      - run: tessera dump-host-id
        expect:
          exit_code: 0
          stdout_matches: 'source\tstatus\thash_hex\thash_prefix\traw\tnormalized\tactive_under_current_config\treason'
      - run: tessera dump-host-id
        expect:
          exit_code: 0
          stdout_matches: 'machine_id\tok\t[0-9a-f]{64}\t[0-9a-f]{8}\t.*\tyes\t-'
      - run: tessera dump-host-id --output /tmp/tessera-e2e-hostid.tsv
        expect:
          exit_code: 0
      - expect_file:
          path: /tmp/tessera-e2e-hostid.tsv
          mode: "0644"
    teardown:
      - run: rm -f /tmp/tessera-e2e-hostid.tsv

  - id: CLI-003
    title: Снятые подкоманды не воскресают
    requirement: openspec/specs/cli-diagnostics/spec.md
    requires: []
    # Подкоманды версии 0.2.x удалены. Возврат любой из них означал бы, что
    # чужой сценарий автоматизации снова начнёт «работать», делая не то, что
    # делал раньше.
    steps:
      - run: tessera execute
        expect:
          exit_code: 2
          stderr_matches: "unrecognized subcommand 'execute'"
      - run: tessera policy
        expect:
          exit_code: 2
          stderr_matches: "unrecognized subcommand 'policy'"
      - run: tessera gc
        expect:
          exit_code: 2
          stderr_matches: "unrecognized subcommand 'gc'"

  # ГОСТ-шаг префлайта. Кейсы проверяют, что администратор видит состояние
  # ГОСТ-конфигурации ДО первого реального входа, а не узнаёт о нём отказом
  # PAM. Ожидания держатся на идентификаторе записи, а не на тексте сообщения:
  # идентификатор зафиксирован спекой, формулировка — нет.
  - id: CLI-004
    title: Настроенный, но недостижимый ГОСТ-движок останавливает префлайт
    requirement: openspec/specs/cli-diagnostics/spec.md
    requires: []
    # Путь ведёт на существующий читаемый файл, который движком не является:
    # это единственный способ дойти до попытки ЗАГРУЗКИ. Несуществующий путь
    # проверял бы другой барьер — валидатор конфига (см. CLI-007).
    steps:
      - run: helpers/config-mutate.sh gost-engine-broken
      - run: tessera check
        expect:
          exit_code: 1
          stdout_matches: '\[ERROR\] gost_engine_load_failed'
    teardown:
      - run: helpers/config-mutate.sh restore

  - id: CLI-005
    title: Путь к движку без разрешённой ГОСТ-подписи объявляется мёртвой настройкой
    requirement: openspec/specs/cli-diagnostics/spec.md
    requires: []
    # Движок в такой конфигурации не загрузится никогда, но и опасности не
    # представляет — предупреждение, а не отказ: exit остаётся нулевым.
    steps:
      - run: helpers/config-mutate.sh gost-engine-unused
      - run: tessera check
        expect:
          exit_code: 0
          stdout_matches: '\[WARN \] gost_engine_configured_unused'
    teardown:
      - run: helpers/config-mutate.sh restore

  - id: CLI-006
    title: Исправная ГОСТ-конфигурация подтверждается, а не молчит
    requirement: openspec/specs/cli-diagnostics/spec.md
    requires: [gost-engine]
    # Успех обязан быть виден: администратор, настроивший ГОСТ, должен получить
    # подтверждение, что движок действительно загрузился, а не отсутствие
    # жалоб. Проверка выполняет ту же загрузку, что и аутентификация.
    steps:
      - run: helpers/config-mutate.sh gost-engine-real
      - run: tessera check
        expect:
          exit_code: 0
          stdout_matches: '\[INFO \] gost_engine_ok'
    teardown:
      - run: helpers/config-mutate.sh restore

  - id: CLI-007
    title: ГОСТ-подпись без пути к движку отвергается до запуска проверок
    requirement: openspec/specs/gost-crypto/spec.md
    requires: []
    # Отдельный от CLI-004 барьер: конфигурация не доходит до startup-check
    # вовсе, поэтому диагностика идёт в stderr как ошибка загрузки, а не
    # записью pipeline в stdout. Кейсы обязаны различать эти два уровня —
    # иначе регрессия, переносящая проверку с одного на другой, останется
    # незамеченной.
    steps:
      - run: helpers/config-mutate.sh gost-without-path
      - run: tessera check
        expect:
          exit_code: 1
          stderr_matches: 'gost_engine_path is required'
    teardown:
      - run: helpers/config-mutate.sh restore
