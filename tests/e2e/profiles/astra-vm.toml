# Профиль окружения astra-vm.
#
# Профиль описывает ТОЛЬКО тип окружения и его возможности. Адрес, учётная
# запись и ключ живут в ~/.config/tessera-e2e/stand.toml, в таблице
# [hosts.astra-vm], вне git.
#
# Это единственный профиль на настоящей системе, а не в контейнере: здесь есть
# работающий модуль ядра parsec (мандатный контроль целостности), настоящий
# logind и графический вход fly-dm. Всё, что упирается в них, проверяется
# только тут.
#
# Обратная сторона — окружение не одноразовое. Контейнер можно пересоздать
# флагом, виртуальную машину нельзя: испорченный PAM-стек остаётся испорченным,
# и вход в систему теряется вместе с возможностью починить его изнутри.
# Поэтому teardown кейсов на этом профиле — не гигиена, а условие
# работоспособности стенда.

name = "astra-vm"
description = "Astra Linux SE 1.8.4 в виртуальной машине, настоящая система"
driver = "ssh"

# mac есть: модуль parsec загружен, pdp-id отвечает (уровень целостности 63).
# graphics есть: fly-dm активен.
# gost-engine есть: движок установлен и загружается — на этой машине проверен
# полный ГОСТ-вход (pamtester и настоящий fly-dm) реальным удостоверением
# ГОСТ-2012-256. Возможность означает ровно наличие работающего движка, а не
# наличие ГОСТ-удостоверений: фикстуры ГОСТ в git не лежат, и кейсы, которым
# нужен носитель, объявляют своё.
# hardware-token НЕ объявлен: USB-проброс в эту машину не настроен, внутри
# видны только корневые хабы. Объявить его, чтобы кейсы «прошли», значило бы
# получить зелёные результаты там, где ничего не проверялось.
capabilities = ["usb", "service-manager", "mac", "graphics", "gost-engine"]

# Шаги идут по сети и на живой системе, где службы стартуют не мгновенно.
default_timeout = 120

# Служебные коды хелперов образа: сломан стенд, а не продукт.
error_exit_codes = [64, 70]

# Хелперы приезжают на машину как фикстуры: в контейнерных профилях они вшиты
# в образ, а живую машину пересобрать нельзя. Отсюда же берётся подстановка
# {{helpers}}, поэтому в [vars] её задавать не нужно.
[[fixtures]]
source = "tests/e2e/helpers"
target = "/opt/tessera-e2e/helpers"
var = "helpers"

[[fixtures]]
source = "crates/tessera_core/tests/fixtures"
target = "/opt/tessera-e2e/fixtures"
var = "fixtures"

[[fixtures]]
source = "tests/fixtures/roles"
target = "/opt/tessera-e2e/roles"
var = "roles"

[ssh]
# Адрес, порт, учётная запись и ключ — в [hosts.astra-vm] файла stand.toml.
host = "astra-vm"
