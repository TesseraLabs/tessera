[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8

# `webpki-root-certs`, and only that crate: a bundle of root certificates, which
# is data rather than code and travels under a data licence. Written as an
# exception rather than as a line in `allow`, because a licence in `allow` is a
# licence any future dependency may arrive under, and the reasoning below holds
# for this crate alone.
#
# It comes with ureq's `native-tls` feature — the feature the Vault path has to
# have, since ureq gates every https connection on it — and the Vault adapter
# never trusts the bundle: it uses the platform verifier or the CA the operator
# supplied. Allowed because the alternative is either an https path that panics
# or a fork of ureq's feature graph.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
