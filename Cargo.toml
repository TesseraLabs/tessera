[workspace]
resolver = "2"
members = [
    "crates/tessera_codes_contract",
    "crates/tessera_core",
    "crates/tessera_ext",
    "crates/tessera_hashchain",
    "crates/tessera_issuer",
    "crates/tessera_proto",
    "crates/pam_tessera",
    "crates/tessera_cli",
    "crates/tessera_cp",
    "crates/tessera_win_service",
    "crates/tessera_test_plugin",
    "crates/xtask",
]
# Раннер e2e — инструмент разработчика: он не собирается и не тестируется
# обычными `cargo build` / `cargo test` без явного `-p xtask`, поэтому не
# удлиняет ни сборку пакета, ни прогон unit-тестов продукта.
default-members = [
    "crates/tessera_codes_contract",
    "crates/tessera_core",
    "crates/tessera_ext",
    "crates/tessera_hashchain",
    "crates/tessera_issuer",
    "crates/tessera_proto",
    "crates/pam_tessera",
    "crates/tessera_cli",
    "crates/tessera_cp",
    "crates/tessera_win_service",
    "crates/tessera_test_plugin",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.95"
# Dual-licensed: AGPL-3.0-only OR commercial (LICENSE.commercial).
license = "AGPL-3.0-only"
repository = "https://github.com/TesseraLabs/tessera"
authors = ["Mikhail Korolev <mikhail@robonet.me>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
toml = "1"
thiserror = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-journald = "0.3"
syslog = "7"
regex = "1.10"
sha2 = "0.11"
openssl = "0.10"
rand = "0.10"
hex = "0.4"
secrecy = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
rustix = { version = "0.38", features = ["fs", "mount", "process", "stdio"] }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
tempfile = "3.10"
proptest = "1.4"
mockall = "0.14"
pam-sys = "1.0.0-alpha5"
subtle = "2.5"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["user", "signal", "process", "fs", "resource", "mount", "poll"] }
libc = "0.2"
udev = "0.9"
cryptoki = "0.12"
parking_lot = "0.12"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
sd-notify = "0.5"
futures-util = "0.3"
once_cell = "1"
unicode-normalization = "0.1"
wildmatch = "2"
# Pure-Rust X.509/DER stack for the issuer tooling (wasm-compatible, no OpenSSL).
der = { version = "0.7", features = ["alloc", "oid"] }
spki = { version = "0.7", features = ["alloc"] }
const-oid = "0.9"
x509-cert = { version = "0.2", default-features = false }
p256 = "0.13"
# ECDSA P-384 signing for the file backend (native-only, behind the `file`
# feature). Same RustCrypto family and pkcs8 version as p256, so the graph
# unifies; never pulled into the wasm core.
p384 = "0.13"
# Direct PKCS#8 access for the file backend: parse PrivateKeyInfo, and decrypt
# EncryptedPrivateKeyInfo (PBES2). `pem` decodes `-----BEGIN [ENCRYPTED] PRIVATE
# KEY-----`; `encryption` pulls the pkcs5/pbes2 backends (scrypt/PBKDF2 +
# AES-CBC) used to decrypt operator keys and to generate encrypted fixtures in
# tests. Native-only, behind the `file` feature.
pkcs8 = { version = "0.10", features = ["encryption", "pem"] }
# PKCS#12 ASN.1 types (`PFX`, `SafeBag`, `CertBag`, `MacData`). Only the format
# lives here; the key is encrypted with PBES2 through `pkcs8`/`pkcs5` and the MAC
# is `hmac`, so no primitive is written by hand. Matches the workspace's `der`
# 0.7 / `x509-cert` 0.2 generation.
#
# The RFC 7292 Appendix B key derivation (`kdf`) is left off here and turned on
# by the issuer alone: the reader in `tessera_core` walks the container's layout
# without a password, and a build of that reader has no reason to carry a key
# derivation it never calls.
pkcs12 = { version = "0.1" }
# `ContentInfo`, the envelope PKCS#12 wraps each safe in. Pulled directly
# because the container assembly builds those envelopes itself; `pkcs12`
# depends on the same version.
cms = "0.2"
hmac = "0.12"
# The PKCS#12 MAC and the RFC 7292 key derivation are on the `digest` 0.10
# generation, while the rest of the workspace is on `sha2` 0.11 (`digest`
# 0.11). Both are already in the graph — `pkcs5` pulls 0.10 — so this alias
# only makes the older one nameable where the container code needs it.
sha2_pkcs12 = { package = "sha2", version = "0.10" }
# Hardened pure-Rust RSA fork (MIT OR Apache-2.0), kept under the local crate
# name `rsa` so issuer code retains the upstream-compatible API. `sad-rsa`
# incorporates RustCrypto's `crypto-bigint` migration and padding hardening to
# mitigate Marvin (RUSTSEC-2023-0071); it is not claimed to make every RSA path
# fully constant-time. Pin exactly: upgrades of this security-critical fork
# require an explicit review. Encoding is needed for CSR SPKI and PKCS#8 keys.
rsa = { package = "sad-rsa", version = "=0.2.3", default-features = false, features = [
    "encoding",
    "std",
] }
# Native-only signing adapters for the issuer tooling (behind feature flags).
# ureq drives Vault Transit signing; base64 (de)serialises DER on the JSON
# boundaries.
# native-tls (OS TLS: Security.framework / SChannel / system OpenSSL), no bundled
# Mozilla roots: trust comes from the host certificate store or an
# operator-supplied CA bundle. This keeps both `webpki-roots` and
# `webpki-root-certs` out of the tree and makes a private-CA Vault the default.
ureq = { version = "3", default-features = false, features = [
    "native-tls-no-default",
    "gzip",
    "json",
] }
base64 = "0.22"
# Console secret entry with the echo turned off, for the issuer CLI. The three
# platforms need termios / Console API calls, and the issuer crate denies
# `unsafe_code`, so the unsafe lives behind this crate instead of being
# reimplemented per platform. Native-only, behind the `cli` feature.
rpassword = "7.5"
# Browser entropy backend for the wasm issuer core: the RustCrypto stack
# (p256/rsa) pulls `getrandom`, which needs the `js` feature on
# `wasm32-unknown-unknown`. Native targets never use this.
getrandom = "0.2"
libloading = "0.9"
# Win32 bindings for the Windows privileged-path walk (owner/DACL inspection),
# removable-volume enumeration and console echo control. Declared per-crate
# under `cfg(windows)` so Unix builds never pull it in.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    # The local account database: `NetUserGetInfo` answers from this machine's
    # own SAM, which is what keeps the account-class question off the network.
    "Win32_NetworkManagement_NetManagement",
    "Win32_Storage_FileSystem",
    # `DRIVE_REMOVABLE` and its siblings live here rather than next to
    # `GetDriveTypeW`.
    "Win32_System_WindowsProgramming",
    # Console mode control: the bench verify tool turns echo off around the
    # PIN prompt.
    "Win32_System_Console",
    # The Engine service: its transport, its registration, and the storage of
    # the technical account's password.
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Services",
    # Overlapped waits: the event a bounded read or connect waits on, and the
    # handle duplication that gives a connection separate read and write ends.
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
] }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
