# Вердикты по кандидатам в доменные сущности (`spec.mjs candidates`).
# Кандидат с вердиктом больше не показывается в очереди. Без этого файла
# отчёт печатал бы одни и те же строки, пока его не перестанут открывать.
#
# verdict: термин | не домен | отложено
#   термин   — заведён термин, указан term_id
#   не домен — с обязательной причиной
#   отложено — контекст ещё не описан; причина говорит, какой именно

