name: ensure rustup
description: Prepare public smoke prerequisites in this job, without deployment credentials.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        missing=()
        for package in pkg-config libudev-dev libssl-dev clang python3-yaml jq; do
          dpkg -s "$package" >/dev/null 2>&1 || missing+=("$package")
        done
        if (( ${#missing[@]} )); then
          sudo=""; [ "$(id -u)" = 0 ] || sudo=sudo
          $sudo apt-get update -qq
          $sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
        fi
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
        fi
