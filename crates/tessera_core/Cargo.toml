[package]
name = "tessera_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core types, config, and traits for Tessera."

[lib]
crate-type = ["rlib"]

[features]
default = []
# Enables the integration tests in `tests/gost_*_real.rs` that exercise real
# GOST PKI fixtures. The fixtures themselves are produced by
# `tests/fixtures/gen_gost.sh` and require a Linux host with `gost-engine`
# installed.  When the feature is enabled but the fixtures are absent, every
# test prints `skipped: ...` and passes.
gost-tests = []
# Enables the integration tests under `tests/pkcs11_*` that talk to a real
# PKCS#11 provider (softhsm2, librtpkcs11ecp, etc.).  When the feature is on
# but no module is available at runtime (e.g. on macOS dev hosts), each test
# prints `skipped: ...` and returns `Ok`.
#
# It also turns on the issuing tool's token-writing path, because the data
# object the reader is tested against has to be put on the token by the code
# that will really put it there — a fixture written by anything else would
# prove the reader works on objects nobody ships.
pkcs11-tests = ["tessera_issuer/pkcs11"]
# Enables in-process MacBackend mock for unit tests on dev hosts without
# libpdp.
mac-tests = ["dep:mockall"]

[dependencies]
tessera_proto = { path = "../tessera_proto", version = "0.5.0" }
tessera_ext = { path = "../tessera_ext", version = "0.5.0" }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
openssl = { workspace = true }
openssl-sys = "0.9"
foreign-types = "0.3"
rand = { workspace = true }
hex = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
chrono = { workspace = true }
cryptoki = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
mockall = { workspace = true, optional = true }
libloading = { workspace = true }
# PKCS#12 container structure, read without the password: the login screen's
# "wrong drive against wrong password" diagnostic walks the container's safes
# itself because `PKCS12_parse` gives up at the encrypted key. Only the ASN.1
# layout is used; every cryptographic step on this path is absent by design —
# `pkcs12` is taken as the workspace declares it, which is without the `kdf`
# feature, so the key derivation is not linked into a build that only reads.
der = { workspace = true }
pkcs12 = { workspace = true }
cms = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }
rustix = { workspace = true }
# The syslog transport is a Unix facility; Windows logging goes through the
# Event Log instead. The crate's own non-Unix fallback does not compile.
syslog = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
udev = { workspace = true }

# Windows has no system OpenSSL to link against, so the library is built from
# the vendored source tree. Unix targets keep using the system package: it is
# what the GOST engine is loaded into, and vendoring would both slow the build
# and change which engine directory is searched.
[target.'cfg(windows)'.dependencies]
openssl = { workspace = true, features = ["vendored"] }
# Owner/DACL inspection for the privileged-path walk; the Unix walk uses
# libc/nix instead, so this is never on the Unix link-line.
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
mockall = { workspace = true }
tracing-subscriber = { workspace = true }
# Cross-crate contract: the issuer builds artifacts, the Engine parsers here
# accept them. `test-support` exposes the self-signed-root helper; no cycle —
# `tessera_issuer` depends only on `tessera_ext`.
tessera_issuer = { path = "../tessera_issuer", version = "0.5.0", features = ["test-support"] }
p256 = { workspace = true }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Футган-ловушки (порт unsafe-hardening пака из ветки 2026-05-14).
mem_forget = "deny"
panic_in_result_fn = "deny"
let_underscore_must_use = "deny"
let_underscore_lock = "deny"
indexing_slicing = "deny"
# Каждый unsafe-блок обязан нести // SAFETY: и одну операцию.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# Гигиена указателей и кастов.
transmute_ptr_to_ptr = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
ref_as_ptr = "warn"
exit = "warn"
