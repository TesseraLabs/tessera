[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Раннер e2e-реестра Tessera. Инструмент разработчика, в поставку не входит."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# Поддерживаемый форк serde_yaml: сам serde_yaml объявлен unmaintained,
# а deny.toml запрещает такие зависимости на уровне workspace.
serde_norway = "0.9"
# Безопасная регистрация обработчика сигнала: перехват Ctrl-C нужен, чтобы
# teardown отработал, а поднимать ради этого unsafe-обёртку над sigaction незачем.
signal-hook = { version = "0.3", default-features = false }
# Генератор фикстур телефонного канала собирает документы контракта и контейнер
# ключа устройства теми же крейтами, что читают их продукт и устройство: своей
# сериализации, своих подписей и своей сборки PKCS#12 у генератора нет.
tessera_codes_contract = { path = "../tessera_codes_contract", version = "0.5.0" }
tessera_issuer = { path = "../tessera_issuer", version = "0.5.0" }
tessera_ext = { path = "../tessera_ext", version = "0.5.0" }
# Ключи фикстур: генерация, подписи документов и запись в PKCS#8/SPKI PEM.
p256 = { workspace = true, features = ["pem"] }

[dev-dependencies]
tempfile = { workspace = true }
# Тест связности комплекта читает PEM-якоря обратно в DER.
base64 = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
panic_in_result_fn = "deny"
let_underscore_must_use = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
