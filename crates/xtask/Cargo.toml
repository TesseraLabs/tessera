[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Раннер e2e-реестра Tessera. Инструмент разработчика, в поставку не входит."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# Поддерживаемый форк serde_yaml: сам serde_yaml объявлен unmaintained,
# а deny.toml запрещает такие зависимости на уровне workspace.
serde_norway = "0.9"
# Безопасная регистрация обработчика сигнала: перехват Ctrl-C нужен, чтобы
# teardown отработал, а поднимать ради этого unsafe-обёртку над sigaction незачем.
signal-hook = { version = "0.3", default-features = false }
# Генератор фикстур телефонного канала собирает документы контракта и контейнер
# ключа устройства теми же крейтами, что читают их продукт и устройство: своей
# сериализации, своих подписей и своей сборки PKCS#12 у генератора нет.
tessera_codes_contract = { path = "../tessera_codes_contract", version = "0.6.0" }
# `file` — подписывающий ключ с диска: комплект фикстур стенда подписывается
# настоящей ECDSA, а не заглушкой. Заглушка годилась бы ровно для стенда,
# который подписей не проверяет.
tessera_issuer = { path = "../tessera_issuer", version = "0.6.0", features = ["file"] }
# Цепочка выдающей стороны для фикстуры «журнал без выдач»: строки пишет тот же
# крейт, что и продуктив, второго писателя формата заводить нельзя.
# `testing` даёт хранилище в памяти: фикстура собирается один раз и
# замораживается, писать её через файловое хранилище значило бы заводить
# временный файл ради строк, которые тут же уходят в комплект.
tessera_hashchain = { path = "../tessera_hashchain", version = "0.6.0", features = ["testing"] }
tessera_ext = { path = "../tessera_ext", version = "0.6.0" }
# Ключи фикстур: генерация, подписи документов и запись в PKCS#8/SPKI PEM.
p256 = { workspace = true, features = ["pem"] }
# Комплект фикстур стенда пишет сертификаты и список отзыва в PEM, а ключ
# подписи — во временный файл, который читает подписывающий крейт.
base64 = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
# Только ради одной проверки: имя файла со списком адресов страницы инженера
# записано в раннере строкой, и тест сверяет её с константой продукта. В сам
# раннер `tessera_core` не тянем — он ему не нужен, а тянуть крейт целиком ради
# строки значит удлинить сборку инструмента разработчика.
tessera_core = { path = "../tessera_core", version = "0.6.0" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
panic_in_result_fn = "deny"
let_underscore_must_use = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
