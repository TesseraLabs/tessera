[package]
name = "tessera_issuer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Certificate-issuance core for Tessera: builds TBS with the project's custom X.509 extensions, enforces delegation-envelope monotonicity before signing, and self-verifies against the Engine's shared parsers."

[lib]
crate-type = ["rlib"]

[[bin]]
name = "issuer"
path = "src/bin/issuer.rs"
required-features = ["cli"]

[features]
# The native profile: OS-entropy serial generation and the CLI binary. Off for
# the `wasm32-unknown-unknown` core build, where entropy comes from the browser
# host and the binary is not built.
default = ["native"]
native = ["dep:rand", "tessera_hashchain/file"]
# The container password travels the same ladder as the backend secrets, so
# the CLI needs the secret wrapper even when no signing backend is built in.
cli = ["native", "dep:clap", "dep:rpassword", "dep:secrecy"]
# Exposes the deterministic in-crate signer so integration tests (and, later,
# the CLI's dry-run mode) can assemble artifacts without a real key store.
test-support = ["tessera_hashchain/testing"]
# PKCS#11 signing adapter (token/HSM). Native-only: not built for the wasm core.
pkcs11 = ["native", "dep:cryptoki", "dep:secrecy"]
# Vault/OpenBao Transit signing adapter. Native-only. serde/serde_json/base64/
# sha2 are core dependencies (the journal and CSR paths need them), so this
# feature only adds the HTTP transport and secret handling.
vault = [
    "native",
    "dep:ureq",
    "dep:secrecy",
]
# On-disk PKCS#8 CA key signing adapter. Native-only. p256/p384/pkcs8 and the
# container-assembly crates are core dependencies (leaf-key generation and
# PKCS#12 packaging need them), so this feature only adds the secret handling
# the CA key file's passphrase goes through.
file = [
    "native",
    "dep:secrecy",
]
# Integration-test gates, mirroring tessera_core's `pkcs11-tests`: the heavy
# tests compile only with these on and still skip gracefully (print `skipped:`
# and return Ok) when the external dependency — a SoftHSM module, the `vault`
# binary — is absent at runtime.
pkcs11-tests = ["pkcs11"]
vault-tests = ["vault"]

[dependencies]
tessera_ext = { path = "../tessera_ext", version = "0.5.0" }
# The frozen contract of the phone channel: the code formula, the documents and
# their canonical bytes. The operator side of the channel holds no second
# implementation of any of them — a divergence would show up as "the code does
# not fit" at the device, not in CI.
tessera_codes_contract = { path = "../tessera_codes_contract", version = "0.5.0" }
# The shared hash-chained record: line framing, head-signature accounting and
# verification. The device's audit chain is built on the same crate, so the two
# journals cannot drift into two dialects of one format.
tessera_hashchain = { path = "../tessera_hashchain", version = "0.5.0" }
der = { workspace = true }
spki = { workspace = true }
const-oid = { workspace = true }
x509-cert = { workspace = true }
thiserror = { workspace = true }
# Core (wasm-compatible) dependencies. p256/p384/rsa verify a CSR's
# self-signature and generate a leaf key pair; sha2 chains the issuance journal
# and hashes CSR contents; serde/serde_json render and parse the NDJSON journal;
# base64 encodes head signatures.
# `ecdh` is on top of the CSR use: the operator side of the phone channel agrees
# the shared secret with the device on the fleet's P-256 profile.
p256 = { workspace = true, features = ["ecdh"] }
p384 = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
# PKCS#12 container assembly (wasm-compatible): `pkcs8` shrouds the private key
# with PBES2 and reads it back, `pkcs12`/`cms` carry the container's ASN.1, and
# `hmac` + the `digest` 0.10 SHA-256 back the container MAC and its RFC 7292 key
# derivation. `zeroize` keeps the generated private key out of freed memory.
pkcs8 = { workspace = true }
# `kdf` is the container MAC's key derivation, needed where a container is
# written; it is off in the workspace entry so a reader-only build stays without
# it.
pkcs12 = { workspace = true, features = ["kdf"] }
cms = { workspace = true }
hmac = { workspace = true }
sha2_pkcs12 = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
# Console secret entry with the echo off (the CLI's interactive step). Pulled by
# the `cli` feature only, so the wasm core never sees it.
rpassword = { workspace = true, optional = true }
cryptoki = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

# The wasm core (browser cabinet) needs an entropy backend for the RustCrypto
# stack pulled by CSR verification; the browser provides one via getrandom's
# `js` feature. Never compiled for native targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
p256 = { workspace = true, features = ["pem"] }
# The crate's own tests reach the shared chain's in-memory and failing storages
# through `journal::storage`; the feature that carries them is a test aid, not a
# runtime backend, so it is turned on here rather than in `[dependencies]`.
tessera_hashchain = { path = "../tessera_hashchain", version = "0.5.0", features = ["testing", "file"] }
# The file-backend tests write key fixtures to disk with restricted permissions;
# tempfile gives a self-cleaning path. Native-only test aid.
tempfile = { workspace = true }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
panic_in_result_fn = "deny"
let_underscore_must_use = "deny"
let_underscore_lock = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
transmute_ptr_to_ptr = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
ref_as_ptr = "warn"
exit = "warn"
