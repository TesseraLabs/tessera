# /usr/lib/tmpfiles.d/tessera.conf
# Runtime directories for Tessera. Created at boot and on every
# `systemd-tmpfiles --create`. Owned by the dedicated `tessera`
# system user (created by debian/postinst); pam_tessera.so reads the
# IPC socket as root via PAM-caller context, owner+group both
# tessera keep the daemon's writes confined.
d /run/tessera          0750 tessera tessera -
# Sockets of QR-overlay login attempts. Root-owned, traversable by everyone and
# listable by nobody: the overlay runs as the greeter's user and needs to reach
# a socket whose name it was given, while the random name of an attempt must not
# be enumerable by anything else on the machine. The socket inside is created by
# the PAM module as root, then given to the greeter's user with mode 0600.
#
# Beside /run/tessera and not inside it: the traversal check applies to every
# component of a path, so a subdirectory of a 0750 tessera:tessera directory is
# unreachable for the greeter's user whatever mode it carries.
d /run/tessera-overlay  0711 root root -
